name: Metrics Drift

# WHY THIS IS NOT A JOB IN ci.yml
# -------------------------------
# `tests/docs/test_published_metrics.py` compares every scoped document against
# `docs/published_metrics.json` and fails when the two disagree in either
# direction. That test *reads* the manifest; it never runs the harness. So if
# `scripts/evaluate_model.py`, `scripts/evaluate_cost.py`,
# `scripts/train_xgboost_aligned.py` or anything under `src/services/` that the
# harnesses import changes the numbers, and nobody regenerates, then the
# manifest keeps describing the previous run, the documents keep agreeing with
# that stale manifest, and the guard stays green. The prose is describing an
# evaluation that no longer happens and no test notices.
#
# That is the drift this workflow exists to catch, and the fast test structurally
# cannot: comparing documents against a manifest that has stopped corresponding
# to the code is comparing two documents.
#
# A `schedule:` on ci.yml would close the gap by running every job in that file
# -- backend lint, mypy, the pytest suite with coverage, frontend lint, frontend
# tests, frontend build and both docker builds -- every night, in order to
# rewrite one JSON file. This workflow runs only the generator, so the nightly
# cost is one job instead of six, and the generator's 7-16 minutes are not
# blocking anyone's pull request.

on:
  schedule:
    # 23:41 UTC. GitHub-hosted runners are on UTC and this repository's
    # contributors are in Europe/Madrid, so 23:41 UTC lands at 01:41 CEST /
    # 00:41 CET -- the middle of the night, which is not a time anyone is
    # pushing to this branch. Two deliberate choices there: an off-peak hour
    # keeps the run from competing with the working day for runner capacity,
    # and the odd minute (41) avoids the top of the hour, where every scheduled
    # workflow on GitHub tries to start simultaneously and the platform's own
    # queueing delay is highest. Daily, not hourly: the generator takes 7-16
    # minutes and a cron that re-fires every hour would start overlapping runs.
    - cron: "41 23 * * *"
  workflow_dispatch:

env:
  # Same value ci.yml pins. The manifest is produced by the same Python the
  # suite is green on; regenerating it under a different interpreter would make
  # a drift failure indistinguishable from an environment difference, which is
  # the one thing this job must not be ambiguous about.
  PYTHON_VERSION: "3.11"

jobs:
  published-metrics:
    name: Regenerate manifest and fail on drift
    runs-on: ubuntu-latest
    # The generator takes 7-16 minutes. 60 is generous for that and still
    # bounds a hung run, which would otherwise hold a runner until GitHub's
    # six-hour default killed it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # No services block, and that is the point: the generator loads the
      # committed model artifact, the committed synthetic corpus and nothing
      # else. No Postgres, no Redis, no Ollama. A nightly job that needed a
      # database would fail for reasons unrelated to drift, and a guard that
      # fails for unrelated reasons gets ignored.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Regenerate docs/published_metrics.json
        # No arguments: `scripts/generate_published_metrics.py` has no argparse
        # and its `__main__` block calls `main()`, which writes the manifest to
        # `docs/published_metrics.json` at the repository root. It *imports* the
        # harnesses' functions instead of parsing their stdout, so a cosmetic
        # edit to a `print()` cannot silently move a published number. Run from
        # the repository root, which is the default working directory here.
        run: python scripts/generate_published_metrics.py

      # The check itself. Regenerating and diffing is the only honest form of
      # this gate: comparing the new manifest against the committed one proves
      # the committed file is exactly what the current code produces. Anything
      # weaker -- comparing against a hash, checking that the file exists, or
      # grepping for a key -- would pass while the numbers were stale, which is
      # the failure this job exists to prevent.
      #
      # The decision uses `git status --porcelain`, NOT `git diff --quiet`.
      # `git diff` has two verified false-green shapes, and either one turns
      # this gate into a job that goes green forever while the manifest lies:
      #   1. It cannot see an UNTRACKED file. If docs/published_metrics.json were
      #      ever dropped from version control, the generator recreates it and
      #      `git diff` sees nothing at all.
      #   2. It compares worktree against the INDEX, not against HEAD. Any step
      #      that stages the regenerated file makes the difference invisible.
      # `git status --porcelain` reports modified, staged, deleted and untracked
      # alike, so it closes both holes at once and is the check itself rather
      # than a fallback.
      - name: Fail if the manifest drifted from the code
        run: |
          drift="$(git status --porcelain -- docs/published_metrics.json)"
          if [ -z "$drift" ]; then
            echo "docs/published_metrics.json reproduces byte-for-byte from the current harnesses."
            exit 0
          fi
          echo "::error title=Published metrics drifted::docs/published_metrics.json is not what the current harnesses produce. The committed manifest no longer describes the code, and tests/docs/test_published_metrics.py cannot see it because it only compares documents against the manifest."
          echo "--- git status --porcelain ---"
          echo "$drift"
          echo "--- git diff --stat ---"
          git --no-pager diff --stat -- docs/published_metrics.json
          echo "--- git diff ---"
          git --no-pager diff -- docs/published_metrics.json
          echo "--- how to fix ---"
          echo "Run 'python scripts/generate_published_metrics.py' locally, commit docs/published_metrics.json in the same commit as the harness change, and update the prose from the manifest -- never from memory."
          # Must be the last line of THIS step. A `::error::` annotation is a UI
          # decoration and does not fail a step by itself; without this exit the
          # job falls off the end of the block, returns 0, and reports green
          # while printing that the manifest drifted. That is how a gate gets
          # quietly disarmed by an unrelated edit landing one line too high.
          exit 1

      # The second thing this workflow catches, and the more embarrassing one.
      #
      # Both READMEs quote the backend test count by hand, in four places each.
      # It has gone stale three times in two days: once when tests were added,
      # once when they were corrected by hand, and once when
      # tests/test_monitoring.py was deleted. Nothing failed. A reader who runs
      # the command the README itself prints gets a different number, and the
      # README is the project's front page.
      #
      # The case study quotes the SAME number and was outside this gate, which
      # is how `case-study/{en,es}/index.html` carried "1218 backend tests" for
      # an extended period while both READMEs said 1501. Two front doors for one
      # repository, disagreeing, and no signal. The two checks below close that
      # gap: identical pattern, identical source of truth (`pytest
      # --collect-only`), just a third and fourth file.
      #
      # It lives here and not in tests/docs/ for a concrete reason: collecting
      # the suite loads tests/conftest.py, which raises ValidationError at
      # import without REDIS_PASSWORD. tests/docs/ is a 0.3-second check that
      # needs no environment, and this one needs `pytest tests/ -q` to actually
      # run. Mixing the two would either slow the fast guard to two minutes or
      # make it depend on credentials it has no business needing.
      #
      # Note the division of labour with tests/docs/test_case_study_figures.py:
      # that file derives the endpoint count, the rule weights and the enums FROM
      # THE CODE and so belongs in the fast per-PR gate. This figure is a
      # collection count, which cannot be derived without running collection --
      # so it stays here, where collection already runs.
      - name: Fail if the READMEs quote stale test counts
        env:
          # Present only to satisfy src.core.config.Settings at import; this job
          # talks to no database. `db_password`, `redis_password` and
          # `redis_url` are the three fields Settings declares with no default,
          # and `.env` is gitignored, so a runner has none of them. Omitting
          # `REDIS_URL` raises ValidationError before a single test collects --
          # ci.yml's backend-test sets all three and says why.
          REDIS_PASSWORD: unused_in_scheduled_job
          DB_PASSWORD: unused_in_scheduled_job
          DB_USER: fraud
          DB_NAME: fraud_detector
          REDIS_URL: redis://localhost:6379/0
        run: |
          # `|| true` on the pytest call is load-bearing, not defensive noise.
          # GitHub Actions runs `run:` blocks with `bash -eo pipefail`, so a
          # non-zero pytest propagates through the pipe and `set -e` aborts the
          # step ON THAT LINE -- before `echo "$summary"`, so the captured
          # output is thrown away and the job reports failure with no output at
          # all. A guard that dies silently gets deleted by the next person who
          # does not trust it.
          set +e
          summary="$(python -m pytest tests/ -q 2>&1 | tail -5)"
          pytest_status=$?
          set -e
          echo "$summary"
          if [ "$pytest_status" -ne 0 ]; then
            echo "::error title=Suite did not pass::'pytest tests/ -q' exited $pytest_status. The documented counts cannot be verified against a red suite, so this step refuses to judge the READMEs. Fix the suite first."
            exit 1
          fi
          # Each extraction tolerates an empty result, because a `grep` that
          # matches nothing also exits 1 under pipefail and would kill the step
          # before it can say WHICH file was wrong. An empty value is then
          # caught explicitly below, with a message.
          collected="$(python -m pytest tests/ --collect-only -q 2>&1 | grep -oE '[0-9]+ tests? collected' | head -1 | grep -oE '^[0-9]+' || true)"
          passed="$(echo "$summary" | grep -oE '[0-9]+ passed' | head -1 | grep -oE '^[0-9]+' || true)"
          echo "collected=$collected passed=$passed"
          if [ -z "$collected" ] || [ -z "$passed" ]; then
            echo "::error title=Could not read the test counts::The step could not parse pytest output, so it cannot say whether the READMEs are stale. That is itself a failure: the numbers were unverifiable."
            exit 1
          fi
          drift=0
          check() {
            local file="$1" pattern="$2" label="$3" expected="$4"
            # An exact expected count, not `grep -q`. The number is quoted in
            # four places per README, and a partial update -- someone fixing the
            # summary line and missing the other three -- is the realistic human
            # failure. `grep -q` passes on the first match, so it would ship a
            # README that contradicts itself.
            local hits
            hits="$(grep -cE "$pattern" "$file" || true)"
            if [ "$hits" -eq "$expected" ]; then
              echo "  ok   $file  ($label, $hits/$expected places)"
            else
              echo "::error title=Stale test count::$file says $label in $hits place(s), expected $expected. A partial update leaves a README that contradicts itself."
              drift=1
            fi
          }
          check README.md    "$collected backend tests"    "$collected backend tests" 3
          check README.es.md "$collected (backend )?tests de backend" "$collected tests de backend" 3
          check README.md    "$passed passed"              "$passed passed" 2
          check README.es.md "$passed pasados"              "$passed pasados" 2
          # The case study. One stat pill per locale, so 1/1 -- not 3. If a
          # future chapter starts repeating the count, bump these deliberately.
          check case-study/en/index.html "$collected backend tests" "$collected backend tests" 1
          check case-study/es/index.html "$collected tests de backend" "$collected tests de backend" 1
          if [ "$drift" -ne 0 ]; then
            echo ""
            echo "The READMEs and the case study quote the backend test count by hand."
            echo "Re-run 'pytest tests/ -q' and 'pytest tests/ --collect-only -q', then"
            echo "update ALL the places in README.md, README.es.md and both case-study"
            echo "index.html files in the same commit that changed the count."
            echo ""
            echo "If those documents were STRUCTURALLY edited too -- a line added that"
            echo "also quotes the count -- the expected 3, 2 and 1 above are stale too."
            echo "Bump them in this file deliberately rather than loosening the check:"
            echo "that number is a claim about how often they repeat themselves."
            echo ""
            echo "tests/docs/test_case_study_figures.py cross-checks the case study"
            echo "against README.md on every PR. It cannot check this count itself:"
            echo "deriving it means running collection."
          fi
          exit $drift