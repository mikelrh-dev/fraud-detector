name: CI

on:
  push:
    # enhanced-proyecto carries the project's real work. It was missing here
    # from 2026-08-27 to 2026-10-01, which is why 165 commits landed with no
    # CI validation at all - the pipeline was not subscribed to the branch.
    branches: [main, master, enhanced-proyecto]
  pull_request:
    branches: [main, master, enhanced-proyecto]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      # D1-5. `src/` alone let 62 ruff errors accumulate in `tests/` unnoticed.
      # That is not a cosmetic debt: an unused import in a test is usually a
      # symbol the test stopped using, and D1-2's dead formula was exactly that
      # shape -- a test asserting a local copy of the code instead of the code.
      # Nothing catches a test that stops testing if nothing lints the tests.
      #
      # `scripts/` is now on the ruff command for the same reason, and it was
      # ungated for two independent reasons that are easy to conflate:
      #   1. `[tool.mypy] exclude` in pyproject.toml lists `scripts/`, so a
      #      reader who greps pyproject.toml concludes the directory is
      #      excluded from linting generally. It is not — that list is mypy's,
      #      and `[tool.ruff]` sets no `exclude` at all.
      #   2. The ruff step named `src/ tests/` and stopped. Ruff lints whatever
      #      paths it is handed, so `scripts/` was never passed to any linter.
      # Measured cost of that: 32 errors sat in 13 files, including 14 unused
      # imports. In `scripts/` that shape is not cosmetic. These are the
      # training and data-generation scripts that produce `models/` and
      # `data/`; an import that stopped being used there is often a constant
      # that stopped feeding the feature set or the label rule, and unlike a
      # test it fails by producing a plausible-looking wrong artifact rather
      # than by going red.
      #
      # mypy stays on `src/` only, and the exclusion comes from the COMMAND, not
      # from configuration. The step below runs `mypy src/` and stops there, so
      # tests are never passed to mypy at all. `[tool.mypy] exclude` in
      # pyproject.toml lists scripts/, alembic/ and notebooks/, and tests are
      # absent from it. The earlier comment here attributed this scope to a
      # decision recorded in pyproject.toml, quoting a line that made the same
      # false attribution; that line is corrected in the same commit. Worth being
      # precise, because `mypy tests/` reports 46 errors in 18 files — an open
      # gap, not a policy. This change does not reopen the decision to keep mypy
      # on src/; it only stops this file citing a configuration that does not
      # say what it claims. tests/ci/test_ci_quality_gate.py guards the citation.
      - name: Run ruff
        run: ruff check src/ tests/ scripts/
      - name: Run mypy
        run: mypy src/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud_detector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          DB_USER: fraud
          DB_PASSWORD: fraud
          DB_NAME: fraud_detector
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          # Settings declares redis_password with no default. The only three
          # required fields are db_password, redis_password and redis_url, so
          # omitting this one raised ValidationError at import and killed the
          # whole session before a single test was collected.
          # The CI Redis service runs without --requirepass and uses
          # `redis-cli ping` as its healthcheck, so this value exists only to
          # satisfy the validation - it authenticates nothing.
          REDIS_PASSWORD: unused_in_ci
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-fail-under=80

  frontend-lint-test:
    name: Frontend Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
      - name: Run tests
        working-directory: ./frontend
        run: npm run test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build
        working-directory: ./frontend
        run: npm run build

  # D1/D2 of docs/plans/2026-10-01-gate-de-imagenes-y-verdad-documental.md.
  # Two defects, one honest job.
  #
  # This job used to carry `if: github.event_name == 'pull_request'`, so the
  # image gate never executed on push. Push to `enhanced-proyecto` is this
  # project's real delivery channel (see the `on:` block at the top of this
  # file), which means every claim that "the image builds" so far came from
  # local runs and from pull requests -- never from the path a change actually
  # travels to reach the branch. A gate that does not run on the delivery path
  # is not a gate. The condition is removed: every push to those branches now
  # pays the two `docker build`s below and reports a real green or a real red.
  # The cost is deliberate and accepted; a cheap gate nobody can trust is more
  # expensive than this one.
  #
  # The job is also renamed, from `Docker Build (smoke test)` to what it
  # actually does. Its only two steps are `docker build`. There is no
  # `docker run`, no container start, no health check, and no reading of any
  # result: the old name asserted a verification the job does not perform, and
  # a reader who trusted it was counting on a guarantee that did not exist.
  # Making this a real smoke test means postgres and redis running *inside this
  # job* (`services:`, the way `backend-test` does it) plus a `docker run`
  # against the built image and an actual probe of `/health/ready`. That is its
  # own work unit and is deliberately out of scope here. An honest name now
  # beats an unkept promise.
  docker-build:
    name: Docker Build (images only)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fraud-detector-api -f docker/Dockerfile.api .
      - name: Build frontend image
        run: >-
          docker build -t fraud-detector-frontend
          -f docker/Dockerfile.frontend .
