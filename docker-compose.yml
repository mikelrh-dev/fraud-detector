services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-fraud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fraud_secret}
      POSTGRES_DB: ${DB_NAME:-fraud_detector}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fraud}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fraud-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --save 60 10000 --requirepass ${REDIS_PASSWORD:-fraud_redis_secret} --protected-mode yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      # A23: the healthcheck has to authenticate. The server always has
      # --requirepass set, but `redis-cli ping` without credentials prints
      # "NOAUTH Authentication required." and still exits 0, so the container
      # reported healthy while proving nothing. A wrong or rotated password then
      # stays invisible: every publish, velocity counter and worker stream fails
      # while the orchestrator believes the dependency is fine.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fraud_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      # `$$` escapes the variable for the container shell, not compose.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fraud-network

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - fraud-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # A3: the API port is deliberately NOT published. It used to be
    # "8000:8000", which created a second ingress that bypassed nginx — the
    # only component that overwrites X-Real-IP. With the port reachable
    # directly, a client could send a fresh X-Real-IP per request and bypass
    # the per-IP rate limiter entirely, making /auth/login an unlimited
    # credential-stuffing target.
    #
    # The frontend container IS nginx (docker/nginx.conf) and already proxies
    # /api to api:8000, so the API stays reachable at http://localhost:3000/api
    # and Swagger at http://localhost:3000/docs. The SPA uses baseURL "/api/v1",
    # i.e. the same origin, so it goes through nginx as well.
    #
    # Because nginx is now the only ingress, TRUST_PROXY_HEADERS must be true:
    # otherwise every request would look like it came from the nginx container
    # and the 10-per-minute login limit would apply to all users at once.
    expose:
      - "8000"
    mem_limit: 2g
    memswap_limit: 2.5g
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-fraud_redis_secret}@redis:6379/0
      OLLAMA_HOST: http://ollama:11434
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    healthcheck:
      # A16: /health is a static literal and cannot see the schema. /health/ready
      # actually runs SELECT 1 against Postgres and PING against Redis, so a
      # container with an unmigrated database now fails its healthcheck instead
      # of reporting healthy and 500ing on the first request.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks:
      - fraud-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    entrypoint: []
    command: ["python", "-m", "src.workers.llm_worker"]
    mem_limit: 500m
    memswap_limit: 600m
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-fraud_redis_secret}@redis:6379/0
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - fraud-network

  shap-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    entrypoint: []
    command: ["python", "-m", "src.workers.shap_worker"]
    mem_limit: 800m
    memswap_limit: 1g
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-fraud_redis_secret}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - fraud-network

  embedding-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    entrypoint: []
    command: ["python", "-m", "src.workers.embedding_worker"]
    mem_limit: 1g
    memswap_limit: 1.2g
    env_file:
      - .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-fraud_redis_secret}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - fraud-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - fraud-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  fraud-network:
    driver: bridge
