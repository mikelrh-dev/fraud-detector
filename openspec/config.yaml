schema: spec-driven

context: |
  Tech stack: Python 3.11 + FastAPI async, PostgreSQL 16 (asyncpg/SQLAlchemy), Redis 7 (Streams), XGBoost, SHAP, Ollama LLM
  Frontend: React 19 + TypeScript 5.6 + Vite 6 + Tailwind 4 (@tailwindcss/vite)
  Architecture: Hexagonal — API layer, services, models, schemas, workers (LLM queue-based)
  Backend tests: pytest + pytest-asyncio + pytest-cov + httpx + factory-boy + faker
  Frontend tests: vitest + @testing-library + msw
  Style: ruff (lint), mypy (types), ESLint (frontend), English code artifacts, Spanish comments
  Design system: DESIGN.md (dark fintech tokens, Tailwind v4 @theme)
  Known issue: 3 worker tests fail collection (pre-existing rot on master)

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Motor de reglas primero; LLM solo genera informes, no decide
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "pytest tests/ -v --cov=src"
    frontend_test_command: "cd frontend && npm test"
  verify:
    test_command: "pytest tests/ -v --cov=src"
    frontend_test_command: "cd frontend && npm test"
    build_command: "ruff check src/ && mypy src/ && cd frontend && npm run build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
