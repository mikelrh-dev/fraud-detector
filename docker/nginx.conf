server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes - SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Overwrite (not append) client-supplied headers to prevent spoofing
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://api:8000;
    }

    # Interactive API docs.
    #
    # The api service publishes no host port (A3), so nginx is the ONLY ingress.
    # Without these two locations, /docs matched no proxying location and fell
    # through to `location /`, which returned the React SPA — so the Quick Start
    # sent every reader to an HTML page at an API URL, and the `curl` register
    # step below it had no reachable host at all.
    #
    # This does not re-expose anything in production: src/api/main.py sets
    # `docs_url` and `openapi_url` to None when ENVIRONMENT=production, so the
    # upstream 404s there and this block forwards the 404. R1-006's guarantee
    # (no public schema enumerating every route in production) is enforced at
    # the application, and this location does not weaken it.
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # The Swagger UI fetches the schema from this path, so without it /docs
    # renders an empty page even in development.
    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}